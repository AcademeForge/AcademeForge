<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2 Photo Collage Maker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef1f5;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 16px;
    text-align: center;
}

header h2 {
    margin: 0;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* =========================
   CONTROL PANEL
========================= */

.controls {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

.paste-info {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    text-align: center;
    color: #1e40af;
}

.uploads {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.upload-box {
    border: 2px dashed #aaa;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.upload-box h3 {
    margin-top: 0;
}

input[type="file"] {
    width: 100%;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: 0;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-size: 14px;
}

button:hover {
    opacity: .9;
}

button.secondary {
    background: #4b5563;
}

button.print {
    background: #16a34a;
}

button.danger {
    background: #dc2626;
}

/* =========================
   COLLAGE
========================= */

.collage-wrapper {
    display: flex;
    justify-content: center;
}

#collage {
    width: 800px;
    max-width: 100%;
    aspect-ratio: 2 / 1;
    margin: auto;
    background: white;
    display: flex;
    overflow: hidden;
    position: relative;
}

/* =========================
   PHOTO BOX
========================= */

.photo {
    width: 50%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: #ddd;
    border: 2px solid white;
    cursor: grab;
}

.photo:active {
    cursor: grabbing;
}

.photo img {
    position: absolute;

    /*
      Image is intentionally larger than
      the box so that zoom/pan works nicely.
    */
    width: 100%;
    height: 100%;

    object-fit: cover;

    user-select: none;
    -webkit-user-drag: none;

    transform-origin: center center;

    pointer-events: none;
}

.placeholder {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #777;
    font-size: 18px;
}

/* =========================
   ZOOM CONTROLS
========================= */

.photo-controls {
    margin-top: 20px;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.photo-control {
    background: white;
    padding: 15px;
    border-radius: 10px;

    box-shadow: 0 3px 10px rgba(0,0,0,.05);
}

.photo-control h3 {
    margin-top: 0;
}

.slider {
    width: 100%;
}

/* =========================
   TOAST MESSAGE
========================= */

#toast {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    background: #111827;
    color: white;

    padding: 11px 18px;

    border-radius: 8px;

    z-index: 9999;

    display: none;

    font-size: 14px;

    box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

/* =========================
   PRINT
========================= */

@media print {

    body {
        background: white;
    }

    header,
    .controls,
    .photo-controls,
    #toast {
        display: none !important;
    }

    .container {
        padding: 0;
        margin: 0;
        max-width: none;
    }

    .collage-wrapper {
        display: block;
        width: 100%;
    }

    #collage {
        width: 100%;
        max-width: none;

        margin: 0;

        box-shadow: none;

        page-break-inside: avoid;
    }

    @page {
        size: A4 landscape;
        margin: 10mm;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width: 700px) {

    .uploads,
    .photo-controls {
        grid-template-columns: 1fr;
    }

    #collage {
        aspect-ratio: 1.5 / 1;
    }
}
</style>
</head>


<body>

<header>
    <h2>📸 2 Photo Collage Maker</h2>
</header>


<div class="container">

    <!-- =========================
         CONTROLS
    ========================== -->

    <div class="controls">

        <div class="paste-info">
            💡 <b>Fast Method:</b>
            Photo copy karo aur yahan
            <b>Ctrl + V</b> dabao.
            <br>
            Pehli paste → Photo 1 &nbsp; | &nbsp;
            Dusri paste → Photo 2
        </div>


        <div class="uploads">

            <div class="upload-box">

                <h3>🖼️ Photo 1</h3>

                <input
                    type="file"
                    id="file1"
                    accept="image/*">

            </div>


            <div class="upload-box">

                <h3>🖼️ Photo 2</h3>

                <input
                    type="file"
                    id="file2"
                    accept="image/*">

            </div>

        </div>


        <div class="buttons">

            <button onclick="swapPhotos()">
                🔄 Swap Photos
            </button>

            <button
                class="secondary"
                onclick="resetAllZoom()">

                ↺ Reset Zoom

            </button>

            <button
                class="danger"
                onclick="clearPhotos()">

                🗑 Clear

            </button>

            <button
                class="print"
                onclick="window.print()">

                🖨️ Print

            </button>

        </div>

    </div>


    <!-- =========================
         COLLAGE
    ========================== -->

    <div class="collage-wrapper">

        <div id="collage">

            <!-- PHOTO 1 -->

            <div
                class="photo"
                id="photoBox1">

                <div
                    class="placeholder"
                    id="placeholder1">

                    Photo 1

                </div>

                <img
                    id="img1"
                    style="display:none;"
                    draggable="false">

            </div>


            <!-- PHOTO 2 -->

            <div
                class="photo"
                id="photoBox2">

                <div
                    class="placeholder"
                    id="placeholder2">

                    Photo 2

                </div>

                <img
                    id="img2"
                    style="display:none;"
                    draggable="false">

            </div>

        </div>

    </div>


    <!-- =========================
         PHOTO CONTROLS
    ========================== -->

    <div class="photo-controls">

        <div class="photo-control">

            <h3>🔍 Photo 1 Zoom</h3>

            <input
                class="slider"
                type="range"
                id="zoom1"
                min="1"
                max="3"
                step="0.01"
                value="1">

            <p>
                Zoom:
                <b id="zoomValue1">1.00x</b>
            </p>

        </div>


        <div class="photo-control">

            <h3>🔍 Photo 2 Zoom</h3>

            <input
                class="slider"
                type="range"
                id="zoom2"
                min="1"
                max="3"
                step="0.01"
                value="1">

            <p>
                Zoom:
                <b id="zoomValue2">1.00x</b>
            </p>

        </div>

    </div>

</div>


<!-- TOAST -->

<div id="toast"></div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const file1 =
    document.getElementById("file1");

const file2 =
    document.getElementById("file2");


const img1 =
    document.getElementById("img1");

const img2 =
    document.getElementById("img2");


const placeholder1 =
    document.getElementById("placeholder1");

const placeholder2 =
    document.getElementById("placeholder2");


const photoBox1 =
    document.getElementById("photoBox1");

const photoBox2 =
    document.getElementById("photoBox2");


const zoom1 =
    document.getElementById("zoom1");

const zoom2 =
    document.getElementById("zoom2");


const zoomValue1 =
    document.getElementById("zoomValue1");

const zoomValue2 =
    document.getElementById("zoomValue2");


const toast =
    document.getElementById("toast");


/* =====================================================
   PHOTO STATE
===================================================== */

let pastePhotoNumber = 0;


/*
    Each photo has its own position and zoom.
*/

const photoState = {

    1: {
        zoom: 1,
        x: 0,
        y: 0
    },

    2: {
        zoom: 1,
        x: 0,
        y: 0
    }

};


/* =====================================================
   FILE UPLOAD
===================================================== */

file1.addEventListener("change", function () {

    if (!this.files[0]) {
        return;
    }

    loadImage(
        this.files[0],
        1
    );

});


file2.addEventListener("change", function () {

    if (!this.files[0]) {
        return;
    }

    loadImage(
        this.files[0],
        2
    );

});


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(file, photoNumber) {

    const reader =
        new FileReader();


    reader.onload = function (event) {

        const img =
            photoNumber === 1
                ? img1
                : img2;


        const placeholder =
            photoNumber === 1
                ? placeholder1
                : placeholder2;


        img.src =
            event.target.result;


        img.style.display =
            "block";


        placeholder.style.display =
            "none";


        /*
            Reset position when new photo
            is loaded.
        */

        photoState[photoNumber] = {

            zoom: 1,

            x: 0,

            y: 0

        };


        if (photoNumber === 1) {

            zoom1.value = 1;

            zoomValue1.textContent =
                "1.00x";

        }
        else {

            zoom2.value = 1;

            zoomValue2.textContent =
                "1.00x";

        }


        updateImage(photoNumber);


        showToast(
            "✅ Photo " +
            photoNumber +
            " added"
        );

    };


    reader.readAsDataURL(file);

}


/* =====================================================
   CTRL + V IMAGE PASTE
===================================================== */

document.addEventListener(
    "paste",
    function (event) {

        const clipboard =
            event.clipboardData;


        if (!clipboard) {
            return;
        }


        const items =
            clipboard.items;


        let foundImage = false;


        for (
            let i = 0;
            i < items.length;
            i++
        ) {

            const item =
                items[i];


            /*
                Check whether clipboard
                contains an image.
            */

            if (
                item.type &&
                item.type.startsWith("image/")
            ) {

                const imageFile =
                    item.getAsFile();


                if (!imageFile) {
                    continue;
                }


                foundImage = true;


                /*
                    First paste:
                    Photo 1
                */

                if (pastePhotoNumber === 0) {

                    loadImage(
                        imageFile,
                        1
                    );

                    pastePhotoNumber = 1;

                }


                /*
                    Second paste:
                    Photo 2
                */

                else {

                    loadImage(
                        imageFile,
                        2
                    );

                    pastePhotoNumber = 0;

                }


                event.preventDefault();

                break;
            }

        }


        /*
            If clipboard does not contain
            an image, do nothing.
        */

        if (!foundImage) {

            return;

        }

    }
);


/* =====================================================
   ZOOM
===================================================== */

zoom1.addEventListener(
    "input",
    function () {

        photoState[1].zoom =
            parseFloat(this.value);


        zoomValue1.textContent =
            photoState[1].zoom.toFixed(2) + "x";


        updateImage(1);

    }
);


zoom2.addEventListener(
    "input",
    function () {

        photoState[2].zoom =
            parseFloat(this.value);


        zoomValue2.textContent =
            photoState[2].zoom.toFixed(2) + "x";


        updateImage(2);

    }
);


/* =====================================================
   UPDATE IMAGE POSITION
===================================================== */

function updateImage(photoNumber) {

    const img =
        photoNumber === 1
            ? img1
            : img2;


    const state =
        photoState[photoNumber];


    img.style.transform =
        `translate(${state.x}px, ${state.y}px)
         scale(${state.zoom})`;

}


/* =====================================================
   DRAG / PAN PHOTO
===================================================== */

function enableDragging(
    box,
    photoNumber
) {

    let dragging = false;

    let startX = 0;

    let startY = 0;

    let originalX = 0;

    let originalY = 0;


    box.addEventListener(
        "mousedown",
        function (event) {

            const img =
                photoNumber === 1
                    ? img1
                    : img2;


            if (
                img.style.display === "none"
            ) {

                return;

            }


            dragging = true;


            startX =
                event.clientX;


            startY =
                event.clientY;


            originalX =
                photoState[photoNumber].x;


            originalY =
                photoState[photoNumber].y;


            event.preventDefault();

        }
    );


    window.addEventListener(
        "mousemove",
        function (event) {

            if (!dragging) {
                return;
            }


            const dx =
                event.clientX - startX;


            const dy =
                event.clientY - startY;


            photoState[photoNumber].x =
                originalX + dx;


            photoState[photoNumber].y =
                originalY + dy;


            updateImage(photoNumber);

        }
    );


    window.addEventListener(
        "mouseup",
        function () {

            dragging = false;

        }
    );

}


enableDragging(
    photoBox1,
    1
);


enableDragging(
    photoBox2,
    2
);


/* =====================================================
   TOUCH DRAG
===================================================== */

function enableTouchDragging(
    box,
    photoNumber
) {

    let dragging = false;

    let startX = 0;

    let startY = 0;

    let originalX = 0;

    let originalY = 0;


    box.addEventListener(
        "touchstart",
        function (event) {

            if (
                event.touches.length !== 1
            ) {
                return;
            }


            const img =
                photoNumber === 1
                    ? img1
                    : img2;


            if (
                img.style.display === "none"
            ) {
                return;
            }


            const touch =
                event.touches[0];


            dragging = true;


            startX =
                touch.clientX;


            startY =
                touch.clientY;


            originalX =
                photoState[photoNumber].x;


            originalY =
                photoState[photoNumber].y;

        },
        { passive: true }
    );


    box.addEventListener(
        "touchmove",
        function (event) {

            if (
                !dragging ||
                event.touches.length !== 1
            ) {
                return;
            }


            const touch =
                event.touches[0];


            const dx =
                touch.clientX - startX;


            const dy =
                touch.clientY - startY;


            photoState[photoNumber].x =
                originalX + dx;


            photoState[photoNumber].y =
                originalY + dy;


            updateImage(photoNumber);

        },
        { passive: true }
    );


    box.addEventListener(
        "touchend",
        function () {

            dragging = false;

        }
    );

}


enableTouchDragging(
    photoBox1,
    1
);


enableTouchDragging(
    photoBox2,
    2
);


/* =====================================================
   SWAP PHOTOS
===================================================== */

function swapPhotos() {

    const src1 =
        img1.src;

    const src2 =
        img2.src;


    const display1 =
        img1.style.display;

    const display2 =
        img2.style.display;


    img1.src =
        src2;

    img2.src =
        src1;


    img1.style.display =
        display2;

    img2.style.display =
        display1;


    /*
        Swap placeholders
    */

    const placeholderDisplay1 =
        placeholder1.style.display;

    const placeholderDisplay2 =
        placeholder2.style.display;


    placeholder1.style.display =
        placeholderDisplay2;

    placeholder2.style.display =
        placeholderDisplay1;


    /*
        Swap position + zoom
    */

    const tempState =
        photoState[1];


    photoState[1] =
        photoState[2];


    photoState[2] =
        tempState;


    /*
        Update sliders
    */

    zoom1.value =
        photoState[1].zoom;

    zoom2.value =
        photoState[2].zoom;


    zoomValue1.textContent =
        photoState[1].zoom.toFixed(2) + "x";


    zoomValue2.textContent =
        photoState[2].zoom.toFixed(2) + "x";


    updateImage(1);

    updateImage(2);


    showToast(
        "🔄 Photos swapped"
    );

}


/* =====================================================
   RESET ZOOM
===================================================== */

function resetAllZoom() {

    photoState[1].zoom = 1;
    photoState[1].x = 0;
    photoState[1].y = 0;


    photoState[2].zoom = 1;
    photoState[2].x = 0;
    photoState[2].y = 0;


    zoom1.value = 1;
    zoom2.value = 1;


    zoomValue1.textContent =
        "1.00x";

    zoomValue2.textContent =
        "1.00x";


    updateImage(1);

    updateImage(2);


    showToast(
        "↺ Zoom reset"
    );

}


/* =====================================================
   CLEAR PHOTOS
===================================================== */

function clearPhotos() {

    img1.src = "";

    img2.src = "";


    img1.style.display =
        "none";

    img2.style.display =
        "none";


    placeholder1.style.display =
        "flex";

    placeholder2.style.display =
        "flex";


    file1.value = "";

    file2.value = "";


    photoState[1] = {

        zoom: 1,

        x: 0,

        y: 0

    };


    photoState[2] = {

        zoom: 1,

        x: 0,

        y: 0

    };


    pastePhotoNumber = 0;


    zoom1.value = 1;

    zoom2.value = 1;


    zoomValue1.textContent =
