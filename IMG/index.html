<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorry Nishu 💖</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, #ffb6d9, transparent 35%),
        radial-gradient(circle at bottom right, #b9a7ff, transparent 35%),
        linear-gradient(135deg, #ff6fae, #8e7dff);
      color: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
      position: relative;
      overflow: hidden;
    }

    /* Background floating hearts */
    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      animation: floatUp linear infinite;
      opacity: 0.75;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      width: min(92%, 500px);
      padding: 35px 25px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 5;
      animation: cardIn 1s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .emoji {
      font-size: 65px;
      animation: bounce 1.5s infinite;
      display: inline-block;
      margin-bottom: 10px;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-12px) rotate(5deg);
      }
    }

    h1 {
      font-size: clamp(2.2rem, 10vw, 4rem);
      margin-bottom: 8px;
      text-shadow: 0 5px 15px rgba(0,0,0,.2);
    }

    .name {
      color: #fff6a8;
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #fff6a8;
      }

      to {
        text-shadow:
          0 0 10px #fff6a8,
          0 0 25px #fff6a8;
      }
    }

    .subtitle {
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 15px 0 25px;
      opacity: .95;
    }

    .sorry {
      font-size: 1.35rem;
      font-weight: bold;
      margin: 20px 0;
      line-height: 1.6;
    }

    .question-box {
      margin-top: 25px;
      padding: 22px 15px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.13);
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .question {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      animation: questionIn .5s ease;
    }

    @keyframes questionIn {
      from {
        opacity: 0;
        transform: scale(.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 23px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: .25s ease;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .yes {
      background: #fff;
      color: #ff4f9a;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }

    .yes:hover {
      transform: scale(1.08);
    }

    .no {
      background: rgba(255,255,255,.18);
      color: white;
      border: 1px solid rgba(255,255,255,.4);
    }

    .no:hover {
      transform: translateY(-3px);
    }

    .next {
      margin-top: 20px;
      background: #ffe66d;
      color: #7b4c00;
      display: none;
    }

    .message {
      margin-top: 25px;
      font-size: 1.15rem;
      line-height: 1.7;
      display: none;
      animation: pop .6s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .signature {
      margin-top: 25px;
      font-size: .9rem;
      opacity: .8;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 9px;
      height: 14px;
      top: -20px;
      z-index: 100;
      pointer-events: none;
      animation: confettiFall 2.5s linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform:
          translateY(110vh)
          rotate(720deg);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 18px;
        border-radius: 25px;
      }

      .emoji {
        font-size: 55px;
      }

      .subtitle {
        font-size: .95rem;
      }

      .question {
        font-size: 1.05rem;
      }

      button {
        width: 100%;
        max-width: 230px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- Floating hearts -->
    <div id="hearts"></div>

    <main class="card">

      <div class="emoji">🥺💗</div>

      <h1>
        Sorry <span class="name">Nishu</span>! 💕
      </h1>

      <p class="subtitle">
        Okay okay... I have something VERY important to ask you 😭👉👈
      </p>

      <div class="sorry">
        Can we please press the<br>
        <strong>"Forgive Me"</strong> button? 🥹
      </div>

      <div class="question-box">

        <div id="question" class="question">
          Nishu... are you still angry with me? 😭
        </div>

        <div class="buttons">
          <button class="yes" onclick="answerYes()">
            YESSS! 💖
          </button>

          <button class="no" onclick="answerNo()">
            Hmm... 😤
          </button>
        </div>

        <button id="nextBtn" class="next" onclick="nextQuestion()">
          Next Question ➡️
        </button>

      </div>

      <div id="message" class="message"></div>

      <div class="signature">
        Made with maximum panic &amp; 1000% sincerity 😭💗
      </div>

    </main>
  </div>


  <script>

    const questions = [
      "Nishu... are you still angry with me? 😭",
      "Can I get one tiny chance to make it up to you? 🥺",
      "Can we forget the stupid mistake? 🫣",
      "Do I deserve at least a little forgiveness? 😭👉👈",
      "Okay final question... FRIENDS AGAIN? 🥹💖"
    ];

    let currentQuestion = 0;

    const question = document.getElementById("question");
    const nextBtn = document.getElementById("nextBtn");
    const message = document.getElementById("message");


    function answerYes() {

      createConfetti();

      if (currentQuestion === questions.length - 1) {

        question.innerHTML = "YEEEEESSSSS!!! 😭💖🎉";

        message.style.display = "block";
        message.innerHTML = `
          <strong>NISHUUUUU!!! 🥹💗</strong><br><br>
          Thank you for forgiving me! 😭✨<br>
          I promise I really am sorry.
          <br><br>
          🫶 Peace restored!<br>
          💕 Friendship saved!<br>
          🎉 Happiness unlocked!
        `;

        nextBtn.style.display = "none";

      } else {

        message.style.display = "block";

        message.innerHTML = `
          AAAAAAA YES!!! 😭💗<br>
          Okay okay... one more question! 👀
        `;

        nextBtn.style.display = "inline-block";
      }
    }


    function answerNo() {

      const reactions = [
        "NOOOO 😭💔 Please reconsider!",
        "WAIT WAIT WAIT 😭 I can explain!",
        "NISHU PLEASEEE 🥺👉👈",
        "My apology application has been rejected?! 😭",
        "Okay... activating maximum sorry mode 🚨🥹"
      ];

      question.innerHTML =
        reactions[Math.floor(Math.random() * reactions.length)];

      message.style.display = "block";

      message.innerHTML = `
        <strong>🥺 I'm genuinely sorry!</strong><br>
        Please give me one tiny chance? 💗
      `;

      nextBtn.style.display = "inline-block";
    }


    function nextQuestion() {

      currentQuestion++;

      if (currentQuestion < questions.length) {

        question.style.animation = "none";

        void question.offsetWidth;

        question.style.animation = "questionIn .5s ease";

        question.innerHTML = questions[currentQuestion];

        message.style.display = "none";
        nextBtn.style.display = "none";

      }
    }


    /* Floating hearts */

    function createHeart() {

      const heart = document.createElement("div");

      heart.className = "heart";

      const emojis = [
        "💗",
        "💖",
        "💕",
        "💓",
        "💞",
        "✨",
        "🥹"
      ];

      heart.innerHTML =
        emojis[Math.floor(Math.random() * emojis.length)];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

      heart.style.animationDuration =
        (5 + Math.random() * 6) + "s";

      document.getElementById("hearts").appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 12000);
    }

    setInterval(createHeart, 500);


    /* Confetti */

    function createConfetti() {

      for (let i = 0; i < 80; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.background =
          `hsl(${Math.random() * 360}, 90%, 65%)`;

        confetti.style.animationDuration =
          (1.5 + Math.random() * 2) + "s";

        confetti.style.animationDelay =
          Math.random() * .5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 4000);
      }
    }

  </script>

</body>
</html>
