<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2 Photo Collage Maker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f5;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 16px;
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.controls {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

.uploads {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.upload-box {
    border: 2px dashed #aaa;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

input[type="file"] {
    width: 100%;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: 0;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-size: 14px;
}

button:hover {
    opacity: .9;
}

button.secondary {
    background: #4b5563;
}

button.print {
    background: #16a34a;
}

button.danger {
    background: #dc2626;
}

/* Collage */
#collage {
    width: 800px;
    max-width: 100%;
    aspect-ratio: 2 / 1;
    margin: auto;
    background: white;
    display: flex;
    overflow: hidden;
    position: relative;
}

.photo {
    width: 50%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: #ddd;
    border: 1px solid #fff;
}

.photo img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    pointer-events: none;

    transform-origin: center center;
    transition: transform .1s;
}

.placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
}

.photo-controls {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.photo-control {
    background: white;
    padding: 15px;
    border-radius: 10px;
}

.photo-control h3 {
    margin-top: 0;
}

.slider {
    width: 100%;
}

/* Print */
@media print {

    body {
        background: white;
    }

    header,
    .controls,
    .photo-controls {
        display: none !important;
    }

    .container {
        padding: 0;
        margin: 0;
        max-width: none;
    }

    #collage {
        width: 100%;
        max-width: none;
        margin: 0;
        box-shadow: none;
        page-break-inside: avoid;
    }

    @page {
        size: A4 landscape;
        margin: 10mm;
    }
}

@media(max-width:700px) {

    .uploads,
    .photo-controls {
        grid-template-columns: 1fr;
    }

    #collage {
        aspect-ratio: 1.5 / 1;
    }
}
</style>
</head>

<body>

<header>
    <h2>📸 2 Photo Collage Maker</h2>
</header>

<div class="container">

    <div class="controls">

        <div class="uploads">

            <div class="upload-box">
                <h3>Photo 1</h3>
                <input type="file"
                       id="file1"
                       accept="image/*">
            </div>

            <div class="upload-box">
                <h3>Photo 2</h3>
                <input type="file"
                       id="file2"
                       accept="image/*">
            </div>

        </div>

        <div class="buttons">
            <button onclick="swapPhotos()">
                🔄 Swap Photos
            </button>

            <button class="secondary" onclick="resetZoom()">
                ↺ Reset Zoom
            </button>

            <button class="danger" onclick="clearPhotos()">
                🗑 Clear
            </button>

            <button class="print" onclick="window.print()">
                🖨️ Print
            </button>
        </div>

    </div>


    <!-- COLLAGE -->

    <div id="collage">

        <div class="photo" id="photoBox1">

            <div class="placeholder" id="placeholder1">
                Photo 1
            </div>

            <img id="img1"
                 style="display:none;">

        </div>


        <div class="photo" id="photoBox2">

            <div class="placeholder" id="placeholder2">
                Photo 2
            </div>

            <img id="img2"
                 style="display:none;">

        </div>

    </div>


    <!-- ZOOM CONTROLS -->

    <div class="photo-controls">

        <div class="photo-control">

            <h3>Photo 1 🔍</h3>

            <input
                class="slider"
                type="range"
                id="zoom1"
                min="1"
                max="3"
                step="0.01"
                value="1">

            <p>
                Zoom:
                <span id="zoomValue1">1x</span>
            </p>

        </div>


        <div class="photo-control">

            <h3>Photo 2 🔍</h3>

            <input
                class="slider"
                type="range"
                id="zoom2"
                min="1"
                max="3"
                step="0.01"
                value="1">

            <p>
                Zoom:
                <span id="zoomValue2">1x</span>
            </p>

        </div>

    </div>

</div>


<script>

const file1 = document.getElementById("file1");
const file2 = document.getElementById("file2");

const img1 = document.getElementById("img1");
const img2 = document.getElementById("img2");

const placeholder1 = document.getElementById("placeholder1");
const placeholder2 = document.getElementById("placeholder2");

const zoom1 = document.getElementById("zoom1");
const zoom2 = document.getElementById("zoom2");

const zoomValue1 = document.getElementById("zoomValue1");
const zoomValue2 = document.getElementById("zoomValue2");


// Upload photo 1
file1.addEventListener("change", function() {

    loadImage(
        this.files[0],
        img1,
        placeholder1
    );

});


// Upload photo 2
file2.addEventListener("change", function() {

    loadImage(
        this.files[0],
        img2,
        placeholder2
    );

});


// Load image
function loadImage(file, img, placeholder) {

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        img.src = e.target.result;

        img.style.display = "block";
        placeholder.style.display = "none";

    };

    reader.readAsDataURL(file);
}


// Zoom Photo 1
zoom1.addEventListener("input", function() {

    const value = this.value;

    img1.style.transform =
        `scale(${value})`;

    zoomValue1.textContent =
        value + "x";

});


// Zoom Photo 2
zoom2.addEventListener("input", function() {

    const value = this.value;

    img2.style.transform =
        `scale(${value})`;

    zoomValue2.textContent =
        value + "x";

});


// Swap Photos
function swapPhotos() {

    const tempSrc = img1.src;
    const tempDisplay = img1.style.display;

    img1.src = img2.src;
    img2.src = tempSrc;

    img1.style.display = img2.style.display;
    img2.style.display = tempDisplay;

    const tempPlaceholder =
        placeholder1.style.display;

    placeholder1.style.display =
        placeholder2.style.display;

    placeholder2.style.display =
        tempPlaceholder;

}


// Reset zoom
function resetZoom() {

    zoom1.value = 1;
    zoom2.value = 1;

    img1.style.transform = "scale(1)";
    img2.style.transform = "scale(1)";

    zoomValue1.textContent = "1x";
    zoomValue2.textContent = "1x";

}


// Clear photos
function clearPhotos() {

    img1.src = "";
    img2.src = "";

    img1.style.display = "none";
    img2.style.display = "none";

    placeholder1.style.display = "flex";
    placeholder2.style.display = "flex";

    file1.value = "";
    file2.value = "";

    resetZoom();
}

</script>

</body>
</html>
