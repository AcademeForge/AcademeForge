<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Buttons</title>
<style>
  /* ── Floating sidebar tabs ── */
  .float-sidebar {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 9999;
  }

  .float-tab {
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    background: #cc0000;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 14px 8px;
    border-radius: 6px 0 0 6px;
    cursor: pointer;
    transition: background 0.2s, padding-right 0.2s;
    white-space: nowrap;
    box-shadow: -2px 2px 8px rgba(0,0,0,0.18);
    user-select: none;
  }

  .float-tab:hover {
    background: #aa0000;
    padding-right: 12px;
  }

  /* ── Floating Telegram chat button (bottom right) ── */
  .float-chat-btn {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 0;
    cursor: pointer;
    text-decoration: none;
  }

  .float-chat-label {
    background: #ffffff;
    color: #333;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px 10px 18px;
    border-radius: 999px 0 0 999px;
    box-shadow: -2px 2px 8px rgba(0,0,0,0.13);
    white-space: nowrap;
    border: 1px solid #e0e0e0;
    border-right: none;
    /* hidden by default */
    max-width: 0;
    overflow: hidden;
    padding-left: 0;
    padding-right: 0;
    opacity: 0;
    transition: max-width 0.35s ease, opacity 0.3s ease, padding 0.3s ease;
  }

  .float-chat-btn:hover .float-chat-label {
    max-width: 160px;
    opacity: 1;
    padding: 10px 16px 10px 18px;
  }

  .float-chat-icon {
    width: 52px;
    height: 52px;
    background: #28a745;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
    flex-shrink: 0;
    transition: background 0.2s, transform 0.2s;
  }

  .float-chat-btn:hover .float-chat-icon {
    background: #1f8c3a;
    transform: scale(1.07);
  }

  /* Telegram SVG icon */
  .tg-icon {
    width: 28px;
    height: 28px;
    fill: #ffffff;
  }


</style>
</head>
<body>

<!-- ── Sidebar tabs ── -->
<div class="float-sidebar">
  <a class="float-tab" href="https://youtube.com/@academeforgepro?si=35gafvzbf2Z-x4aW" target="_blank" rel="noopener">
    Youtube
  </a>
  <a class="float-tab" href="https://t.me/+46ubatq-EV0wNjY1" target="_blank" rel="noopener">
    Chat with a Student
  </a>
</div>

<!-- ── Bottom-right Telegram chat button ── -->
<a class="float-chat-btn" href="https://t.me/Helpacademeforge" target="_blank" rel="noopener">
  <span class="float-chat-label">Chat with us</span>
  <span class="float-chat-icon">
    <!-- Telegram paper-plane icon -->
    <svg class="tg-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
    </svg>
  </span>
</a>

</body>
</html>
